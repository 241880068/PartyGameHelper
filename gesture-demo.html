<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势识别 Demo</title>
    <style>
        body {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            font: 18px/1.6 system-ui, sans-serif;
            color: #fff;
            background: #171717;
        }

        .panel {
            padding: 20px;
            margin-bottom: 20px;
            background: #292929;
            border-radius: 12px;
        }

        .value {
            color: #65d889;
            font-weight: 700;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            color: #fff;
            font-size: 17px;
            background: #444;
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>手势识别 Demo</h1>
    <div class="panel">
        <p>模块状态：<span id="status" class="value">初始化中</span></p>
        <p>当前 beta：<span id="angle" class="value">等待传感器</span></p>
        <p>最近动作：<span id="result" class="value">暂无</span></p>
        <p>将手机回到接近水平，再向前或向后翻转超过 45°。</p>
    </div>
    <div id="fallback"></div>

    <script type="module">
        import { initGestureRecognition } from './js/gesture.js';

        const status = document.querySelector('#status');
        const angle = document.querySelector('#angle');
        const result = document.querySelector('#result');
        const fallbackRoot = document.querySelector('#fallback');

        const controller = initGestureRecognition({
            fallbackRoot,
            onSwipeUp: () => {
                result.textContent = '向上翻';
                console.log('[gesture demo] swipe up');
            },
            onSwipeDown: () => {
                result.textContent = '向下翻';
                console.log('[gesture demo] swipe down');
            },
        });

        window.addEventListener('deviceorientation', (event) => {
            if (Number.isFinite(event.beta)) {
                angle.textContent = `${event.beta.toFixed(1)}°`;
                console.log(`[gesture demo] beta: ${event.beta.toFixed(1)}°`);
            }
        });

        window.setInterval(() => {
            status.textContent = controller.getStatus();
        }, 200);
    </script>
</body>
</html>
