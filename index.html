<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151321">
  <title>聚会游戏发牌助手</title>
  <!-- 队友版本：全局样式 -->
  <link rel="stylesheet" href="./css/style.css?v=9">
  <!-- 我的版本：UI布局样式（游戏菜单、主题网格、点击动画等） -->
  <link rel="stylesheet" href="./css/ui.css?v=2">
</head>
<body>
  <div id="feedback-flash" class="feedback-flash" aria-hidden="true"></div>

  <header class="app-header">
    <button id="back-button" class="icon-button hidden" type="button" aria-label="返回主页">←</button>
    <div class="header-title-area">
      <p class="eyebrow">PARTY GAME HELPER</p>
      <h1 id="page-title">聚会游戏</h1>
    </div>
    <button id="music-toggle" class="icon-button" type="button" aria-label="切换静音">🔊</button>
    <div class="status-dot" title="纯前端，无需登录"></div>
  </header>

  <main>
    <!-- ========== 首页：游戏菜单（我的版本布局） ========== -->
    <section id="page-home" class="page active" aria-labelledby="page-title">
      <!-- 我的版本：自定义游戏菜单布局 -->
      <div class="game-menu">
        <!-- 第一行：你划我猜（独占一行） -->
        <div class="game-row full-width">
          <button class="game-item game-item-charades" type="button" data-game="charades">
            <span class="game-icon">🎭</span>
            <strong>你划我猜</strong>
          </button>
        </div>
        <!-- 第二行：狼人杀 + 谁是卧底（并排） -->
        <div class="game-row half-row">
          <button class="game-item game-item-werewolf half-width" type="button" data-game="werewolf">
            <span class="game-icon">🐺</span>
            <strong>狼人杀</strong>
          </button>
          <button class="game-item game-item-undercover half-width" type="button" data-game="undercover">
            <span class="game-icon">🕵️</span>
            <strong>谁是卧底</strong>
          </button>
        </div>
      </div>
    </section>

    <!-- ========== 狼人杀页面 ========== -->
    <section id="page-werewolf" class="page" aria-label="狼人杀">
      <div id="werewolf-setup" class="panel">
        <div class="slider-wrapper">
          <div class="slider-value" id="werewolf-slider-value">6 人</div>
          <input id="werewolf-players-slider" type="range" min="6" max="15" step="1" value="6">
          <div class="slider-marks" aria-hidden="true">
            <span class="mark active" data-value="6" style="left: 0%;">6</span>
            <span class="mark" data-value="9" style="left: 33.33%;">9</span>
            <span class="mark" data-value="12" style="left: 66.67%;">12</span>
            <span class="mark" data-value="15" style="left: 100%;">15</span>
          </div>
        </div>
        <button id="werewolf-start" class="primary-button" type="button">开始</button>
      </div>
      <div id="werewolf-play" class="play-area hidden">
        <div class="progress-row">
          <span id="werewolf-player-label">第 1 位玩家</span>
          <span id="werewolf-progress-label">1 / 6</span>
        </div>
        <div class="progress-track"><i id="werewolf-progress"></i></div>
        <div id="werewolf-card" class="flip-card" aria-live="polite">
          <span class="flip-card-inner">
            <span class="card-face card-front">
              <span class="card-symbol">🎴</span>
              <strong id="werewolf-front-title">点击按钮查看身份</strong>
            </span>
            <span class="card-face card-back role-card">
              <img id="werewolf-role-image" alt="">
              <span id="werewolf-role-fallback" class="role-fallback">🐺</span>
              <strong id="werewolf-role-name">狼人</strong>
            </span>
          </span>
        </div>
        <button id="werewolf-action" class="primary-button" type="button">查看身份</button>
        <button id="werewolf-role-info-btn" class="role-info-btn hidden" type="button">📖 角色介绍</button>
      </div>
    </section>

    <!-- ========== 谁是卧底页面 ========== -->
    <section id="page-undercover" class="page" aria-label="谁是卧底">
      <div id="undercover-setup" class="panel">
        <label class="field-label" for="undercover-players">玩家人数</label>
        <div class="range-row">
          <input id="undercover-players" type="range" min="6" max="15" value="6">
          <output id="undercover-player-output" for="undercover-players">6 人</output>
        </div>
        <label class="field-label" for="undercover-count">卧底人数</label>
        <div class="range-row">
          <input id="undercover-count" type="range" min="1" max="4" value="1">
          <output id="undercover-count-output" for="undercover-count">1 人</output>
        </div>
        <button id="undercover-start" class="primary-button cyan" type="button">随机分配词语</button>
      </div>
      <div id="undercover-play" class="play-area hidden">
        <div class="progress-row">
          <span id="undercover-player-label">第 1 位玩家</span>
          <span id="undercover-progress-label">1 / 6</span>
        </div>
        <div class="progress-track cyan"><i id="undercover-progress"></i></div>
        <div id="undercover-card" class="flip-card" aria-live="polite">
          <span class="flip-card-inner">
            <span class="card-face card-front cyan-face">
              <span class="card-symbol">🗝️</span>
              <strong>点击按钮查看词语</strong>
            </span>
            <span class="card-face card-back word-card">
              <span class="card-symbol">🗝️</span>
              <small>你的词语是</small>
              <strong id="undercover-word">苹果</strong>
            </span>
          </span>
        </div>
        <button id="undercover-action" class="primary-button cyan" type="button">查看词语</button>
      </div>
    </section>

    <!-- ========== 你划我猜页面 ========== -->
    <section id="page-charades" class="page" aria-label="你划我猜">
      <!-- 第一步：主题选择 -->
      <div id="charades-setup" class="panel">
        <p class="section-label">选择词库主题</p>
        <div id="charades-theme-grid" class="theme-list">
          <button class="theme-item" data-theme="film_tv" type="button">
            <span class="theme-icon">🎬</span>
            <span class="theme-label">影视</span>
          </button>
          <button class="theme-item" data-theme="sports" type="button">
            <span class="theme-icon">⚽</span>
            <span class="theme-label">运动</span>
          </button>
          <button class="theme-item" data-theme="food" type="button">
            <span class="theme-icon">🍜</span>
            <span class="theme-label">美食</span>
          </button>
          <button class="theme-item" data-theme="celebrities" type="button">
            <span class="theme-icon">🌟</span>
            <span class="theme-label">明星</span>
          </button>
          <button class="theme-item" data-theme="animals" type="button">
            <span class="theme-icon">🐾</span>
            <span class="theme-label">动物</span>
          </button>
        </div>
      </div>

      <!-- 第二步：时间选择（主题选择后显示） -->
      <div id="charades-time-select" class="panel hidden">
        <p class="section-label">选择游戏时长</p>
        <div class="duration-options">
          <button type="button" data-duration="60">1 分钟</button>
          <button type="button" data-duration="120" class="selected">2 分钟</button>
          <button type="button" data-duration="180">3 分钟</button>
        </div>
        <button id="charades-start" class="primary-button orange" type="button">开始游戏</button>
      </div>

      <!-- 游戏主界面（竖屏布局） -->
      <div id="charades-play" class="charades-play hidden">
        <!-- 顶部：得分（居中） -->
        <div class="charades-top-bar">
          <div class="charades-score-display">
            <span class="charades-score-icon">✅</span>
            <span id="charades-score" class="charades-score-num">0</span>
          </div>
        </div>

        <!-- 中央：当前词语 -->
        <div class="charades-word-area">
          <small id="charades-category" class="charades-category-label">题目</small>
          <strong id="charades-word" class="charades-word-text"></strong>
        </div>

        <!-- 底部：进度条 + 剩余时间 -->
        <div class="charades-bottom-bar">
          <div class="charades-progress-container">
            <div id="charades-bar-fill" class="charades-bar-fill" style="width:100%; background:hsl(120,85%,50%);"></div>
          </div>
          <span id="charades-time" class="charades-time-text">02:00</span>
        </div>

        <!-- 手势提示 -->
        <div class="gesture-legend">
          <span><b class="up">↑</b> 上翻 · 猜对</span>
          <span><b class="down">↓</b> 下翻 · 跳过</span>
        </div>
      </div>
    </section>
  </main>

  <!-- 手势备用按钮 -->
  <section id="gesture-controls" class="gesture-controls hidden" aria-label="手势备用按钮">
    <p id="gesture-status">体感操作不可用，请使用按钮</p>
    <button id="gesture-enable" type="button" class="gesture-enable hidden">启用手机翻转</button>
    <div>
      <button id="gesture-down" type="button" class="gesture-button down">↓ <span>向下翻</span></button>
      <button id="gesture-up" type="button" class="gesture-button up">↑ <span>向上翻</span></button>
    </div>
  </section>

  <!-- 横屏提示覆盖层 -->
  <div id="landscape-hint" class="landscape-hint-overlay hidden">
    <div class="landscape-hint-content">
      <span class="landscape-hint-icon">↻</span>
      <p class="landscape-hint-text">请翻转手机横屏使用</p>
    </div>
  </div>

  <!-- 倒计时覆盖层 -->
  <div id="countdown" class="countdown hidden" role="status" aria-live="assertive">3</div>

  <!-- 暂停/结束确认弹窗 -->
  <div id="pause-end-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pause-end-title">
    <div class="modal-card">
      <h2 id="pause-end-title">游戏进行中</h2>
      <p id="pause-end-message">请选择操作：</p>
      <div class="pause-end-buttons">
        <button id="pause-end-pause" class="primary-button" type="button" style="background:linear-gradient(135deg, #ff9f43, #ef586f);">⏸️ 暂停游戏</button>
        <button id="pause-end-end" class="primary-button" type="button" style="background:linear-gradient(135deg, #dc2626, #b91c1c); margin-top:10px;">🚪 结束游戏</button>
        <button id="pause-end-cancel" class="primary-button" type="button" style="background:linear-gradient(135deg, #6b7280, #4b5563); margin-top:10px;">继续游戏</button>
      </div>
    </div>
  </div>

  <!-- 角色介绍弹窗 -->
  <div id="role-info-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="role-info-title">
    <div class="modal-card">
      <span id="role-info-icon" class="result-icon">🐺</span>
      <h2 id="role-info-title">角色介绍</h2>
      <p id="role-info-camp" class="role-info-camp"></p>
      <p id="role-info-gameplay"></p>
      <p id="role-info-skill" class="role-info-skill"></p>
      <button id="role-info-close" class="primary-button" type="button">知道了</button>
    </div>
  </div>

  <!-- 结果弹窗（你划我猜结束） -->
  <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal-card">
      <span id="result-icon" class="result-icon">🎉</span>
      <h2 id="result-title">本轮结束</h2>
      <p id="result-message"></p>
      <div id="result-details" class="result-details">
        <!-- 两列词语列表由 JS 动态渲染 -->
      </div>
      <div class="result-buttons">
        <button id="result-replay" class="primary-button" type="button" style="background:linear-gradient(135deg, #ff9f43, #ef586f);">🔄 再玩一次</button>
        <button id="result-confirm" class="primary-button" type="button" style="margin-top:10px;">🚪 结束游戏</button>
      </div>
    </div>
  </div>

  <!-- 音频元素 -->
  <!-- bgm-audio 的 src 由 audioManager.js 动态设置，此处不设默认 source -->
  <audio id="bgm-audio" loop preload="auto"></audio>
  <audio id="effect-correct" preload="auto">
    <source src="./assets/audio/correct.wav" type="audio/wav">
  </audio>
  <audio id="effect-skip" preload="auto">
    <source src="./assets/audio/skip.wav" type="audio/wav">
  </audio>

  <!-- 队友版本：ES Module 主入口 -->
  <script type="module" src="./js/main.js?v=9"></script>
  <!-- 我的版本：UI 辅助脚本（导航、弹窗、音乐控制等） -->
  <script type="module" src="./js/ui.js?v=2"></script>
</body>
</html>
