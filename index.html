<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>聚会游戏发牌助手</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: #fef6e4;
  color: #333;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
body { display: flex; flex-direction: column; }

/* ===== Color Palette (Dopamine) ===== */
:root {
  --pink: #ff6b9d;
  --orange: #ff8a5c;
  --yellow: #f9d342;
  --cyan: #00bcd4;
  --lime: #7bc67e;
  --purple: #b388ff;
  --bg: #fef6e4;
  --card-bg: #ffffff;
  --shadow: 0 8px 24px rgba(0,0,0,0.08);
  --radius: 20px;
  --radius-sm: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

/* ===== Page System ===== */
.page {
  display: none;
  flex-direction: column;
  height: 100vh;
  width: 100%;
  position: absolute;
  top: 0; left: 0;
  background: var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.page.active { display: flex; }

/* ===== Top Bar ===== */
.top-bar {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  gap: 12px;
  min-height: 52px;
}
.top-bar .back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--pink);
  color: #fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.top-bar .back-btn:active { transform: scale(0.9); }
.top-bar h1 {
  font-size: 22px;
  font-weight: 800;
  color: #333;
  flex: 1;
}

/* ===== Content Area ===== */
.content {
  flex: 1;
  padding: 16px;
  padding-bottom: calc(16px + var(--safe-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ===== Bento Grid ===== */
.bento-grid {
  display: grid;
  gap: 16px;
  padding: 4px;
}
.bento-grid-2x2 { grid-template-columns: 1fr 1fr; }

/* ===== Card ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 12px;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  aspect-ratio: 1 / 1;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.card:active { transform: scale(0.95); }
.card .icon { font-size: 40px; margin-bottom: 8px; }
.card .label {
  font-size: 18px;
  font-weight: 700;
  color: #333;
}
.card .sub-label {
  font-size: 13px;
  color: #888;
  margin-top: 4px;
}

/* Colorful card variants */
.card-pink { background: linear-gradient(135deg, #ff6b9d, #ff8a80); color: #fff; }
.card-orange { background: linear-gradient(135deg, #ff8a5c, #ffb74d); color: #fff; }
.card-cyan { background: linear-gradient(135deg, #00bcd4, #4dd0e1); color: #fff; }
.card-lime { background: linear-gradient(135deg, #7bc67e, #aed581); color: #fff; }
.card-purple { background: linear-gradient(135deg, #b388ff, #ea80fc); color: #fff; }
.card-yellow { background: linear-gradient(135deg, #f9d342, #fff176); color: #333; }
.card-pink .label, .card-orange .label, .card-cyan .label, .card-lime .label, .card-purple .label { color: #fff; }
.card-yellow .label { color: #333; }

/* ===== Card Flip ===== */
.card-flip-container {
  perspective: 1000px;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  aspect-ratio: 3 / 4;
}
.card-flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
.card-flip-inner.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow);
}
.card-face-front {
  background: linear-gradient(145deg, #ff6b9d, #b388ff);
  color: #fff;
}
.card-face-back {
  background: linear-gradient(145deg, #00bcd4, #7bc67e);
  color: #fff;
  transform: rotateY(180deg);
}
.card-face .big-text {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.4;
}
.card-face .sub-text {
  font-size: 16px;
  margin-top: 12px;
  opacity: 0.9;
}
.card-face .emoji-big { font-size: 56px; margin-bottom: 12px; }
.card-face .role-img {
  width: 80%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 12px;
  margin-bottom: 8px;
}



/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 28px;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  min-width: 120px;
}
.btn:active { transform: scale(0.95); }
.btn-pink { background: var(--pink); color: #fff; box-shadow: 0 4px 12px rgba(255,107,157,0.4); }
.btn-cyan { background: var(--cyan); color: #fff; box-shadow: 0 4px 12px rgba(0,188,212,0.4); }
.btn-orange { background: var(--orange); color: #fff; box-shadow: 0 4px 12px rgba(255,138,92,0.4); }
.btn-lime { background: var(--lime); color: #fff; box-shadow: 0 4px 12px rgba(123,198,126,0.4); }
.btn-yellow { background: var(--yellow); color: #333; box-shadow: 0 4px 12px rgba(249,211,66,0.4); }

/* ===== Timer / Score Display ===== */
.timer-display {
  position: fixed;
  top: 60px;
  right: 16px;
  background: var(--pink);
  color: #fff;
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 20px;
  font-weight: 800;
  z-index: 50;
  box-shadow: 0 4px 12px rgba(255,107,157,0.4);
}
.score-display {
  position: fixed;
  bottom: calc(100px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--purple);
  color: #fff;
  padding: 10px 24px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: 700;
  z-index: 50;
  box-shadow: 0 4px 12px rgba(179,136,255,0.4);
  white-space: nowrap;
}

/* ===== Countdown Overlay ===== */
.countdown-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.countdown-overlay.show { display: flex; }
.countdown-number {
  font-size: 120px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  animation: countPop 0.8s ease-out;
}
@keyframes countPop {
  0% { transform: scale(2); opacity: 0; }
  50% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.9); opacity: 0.8; }
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff;
  border-radius: var(--radius);
  padding: 32px 24px;
  max-width: 340px;
  width: 100%;
  text-align: center;
  box-shadow: 0 16px 48px rgba(0,0,0,0.2);
}
.modal-box h2 { font-size: 24px; margin-bottom: 12px; }
.modal-box p { font-size: 16px; color: #666; margin-bottom: 20px; line-height: 1.5; }

/* ===== Word Tag (你划我猜) ===== */
.word-tag {
  display: inline-block;
  background: var(--yellow);
  color: #333;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 700;
  position: fixed;
  top: 60px;
  left: 12px;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.3s ease;
}

/* ===== Gyro Unavailable Banner ===== */
.gyro-banner {
  display: none;
  background: #ff4444;
  color: #fff;
  text-align: center;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 700;
  position: sticky;
  top: 52px;
  z-index: 20;
}
.gyro-banner.show { display: block; }

/* ===== Game Action Area ===== */
.game-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 20px 0;
}
.game-action .btn-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== Utility ===== */
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-16 { margin-bottom: 16px; }
.text-center { text-align: center; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.w-full { width: 100%; }

/* ===== Scrollbar Hide ===== */
.content::-webkit-scrollbar { display: none; }

/* ===== Responsive ===== */
@media (min-width: 420px) {
  .bento-grid-2x2 { grid-template-columns: 1fr 1fr; }
  .card .icon { font-size: 48px; }
  .card .label { font-size: 20px; }
}
</style>
</head>
<body>

<script>
// ============================================================
//  STATE & CONFIG
// ============================================================
const STATE = {
  currentPage: 'home',
  // Werewolf
  ww: { roles: [], index: 0, flipped: false, done: false, started: false },
  // Spy
  spy: { players: 0, words: [], spyIndex: -1, index: 0, flipped: false, done: false, started: false },
  // Charades
  ch: { time: 0, words: [], index: 0, correct: 0, timer: null, running: false, correctWords: [] },
  // Gyro
  gyroAvailable: false,
};

// ============================================================
//  WEREWOLF DATA
// ============================================================
const WEREWOLF_ROLES = {
  6: ['狼人','狼人','预言家','女巫','猎人','平民'],
  9: ['狼人','狼人','狼人','预言家','女巫','猎人','守卫','平民','平民'],
  12: ['狼人','狼人','狼人','狼人','预言家','女巫','猎人','守卫','白痴','平民','平民','平民'],
};

const WEREWOLF_EMOJI = {
  '狼人':'🐺','预言家':'🔮','女巫':'🧙','猎人':'🏹','守卫':'🛡️','白痴':'🤪','平民':'👤'
};

// ============================================================
//  SPY WORD PAIRS
// ============================================================
const SPY_WORDS = [
  ['苹果','香蕉'],
  ['电脑','鼠标'],
  ['牛奶','豆浆'],
  ['钢笔','铅笔'],
  ['沙发','椅子'],
  ['西瓜','哈密瓜'],
  ['眼镜','墨镜'],
  ['火车','高铁'],
  ['蛋糕','面包'],
  ['雨伞','雨衣'],
];

// ============================================================
//  CHARADES WORDS
// ============================================================
const CHARADES_WORDS = [
  '手机','空调','大象','跳舞','自行车','太阳','月亮','星星','电脑','书本',
  '吉他','篮球','游泳','飞机','火车','蛋糕','雨伞','眼镜','帽子','鞋子',
  '熊猫','老虎','兔子','乌龟','金鱼','玫瑰','向日葵','钢琴','小提琴','相机',
  '冰箱','洗衣机','电视','台灯','闹钟','钥匙','钱包','背包','地图','指南针',
];

// ============================================================
//  GYROSCOPE CHECK
// ============================================================
function checkGyroAvailability() {
  // Check if DeviceOrientationEvent exists and is not denied
  if (typeof DeviceOrientationEvent === 'undefined') {
    STATE.gyroAvailable = false;
    document.getElementById('gyro-banner').classList.add('show');
    return false;
  }
  // For iOS 13+, need to request permission
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // We'll request on first user interaction
    STATE.gyroAvailable = true; // optimistic, will be confirmed after request
    return true;
  }
  STATE.gyroAvailable = true;
  return true;
}

function requestGyroPermission() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === 'granted') {
          STATE.gyroAvailable = true;
          document.getElementById('gyro-banner').classList.remove('show');
          window.addEventListener('deviceorientation', handleOrientation);
        } else {
          STATE.gyroAvailable = false;
          document.getElementById('gyro-banner').classList.add('show');
        }
      })
      .catch(() => {
        STATE.gyroAvailable = false;
        document.getElementById('gyro-banner').classList.add('show');
      });
  } else if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', handleOrientation);
    STATE.gyroAvailable = true;
  } else {
    STATE.gyroAvailable = false;
    document.getElementById('gyro-banner').classList.add('show');
  }
}

// ============================================================
//  ORIENTATION HANDLING
// ============================================================
let lastGamma = null;
const SWIPE_THRESHOLD = 15;

function handleOrientation(event) {
  if (event.gamma === null) return;
  if (lastGamma === null) {
    lastGamma = event.gamma;
    return;
  }
  const diff = event.gamma - lastGamma;
  if (diff > SWIPE_THRESHOLD) {
    // Swipe right (tilt right) = swipe up action
    triggerSwipeUp();
    lastGamma = event.gamma;
  } else if (diff < -SWIPE_THRESHOLD) {
    // Swipe left (tilt left) = swipe down action
    triggerSwipeDown();
    lastGamma = event.gamma;
  }
}

// ============================================================
//  NAVIGATION
// ============================================================
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (page === 'home') {
    document.getElementById('page-home').classList.add('active');
    STATE.currentPage = 'home';
    stopCharadesTimer();
    return;
  }
  const el = document.getElementById('page-' + page);
  if (el) { el.classList.add('active'); STATE.currentPage = page; }
}

function showComingSoon() {
  showModal('🎲 敬请期待', '更多精彩游戏即将上线，敬请期待！');
}

// ============================================================
//  MODAL
// ============================================================
function showModal(title, text) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// ============================================================
//  VIBRATE
// ============================================================
function vibrate() {
  try { navigator.vibrate(50); } catch(e) {}
}

// ============================================================
//  GESTURE INTEGRATION
// ============================================================
window.onSwipeUp = function() { triggerSwipeUp(); };
window.onSwipeDown = function() { triggerSwipeDown(); };

function triggerSwipeUp() {
  vibrate();
  window.dispatchEvent(new CustomEvent('swipeUp'));
  const page = STATE.currentPage;
  if (page === 'werewolf') werewolfNext();
  else if (page === 'spy') spyNext();
  else if (page === 'charades') charadesCorrect();
}

function triggerSwipeDown() {
  vibrate();
  window.dispatchEvent(new CustomEvent('swipeDown'));
  const page = STATE.currentPage;
  if (page === 'charades') charadesSkip();
}

// ============================================================
//  WEREWOLF
// ============================================================
function startWerewolf(num) {
  const roles = [...(WEREWOLF_ROLES[num] || WEREWOLF_ROLES[12])];
  // Shuffle
  for (let i = roles.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [roles[i], roles[j]] = [roles[j], roles[i]];
  }
  STATE.ww = { roles, index: 0, flipped: false, done: false, started: false };
  document.getElementById('werewolf-select').style.display = 'none';
  document.getElementById('werewolf-deal').style.display = 'block';
  // Show "发牌开始" on front
  document.getElementById('werewolf-card').classList.remove('flipped');
  document.getElementById('werewolf-front-text').textContent = '发牌开始';
  document.getElementById('werewolf-skip-btn').textContent = '开始';
  document.getElementById('werewolf-progress').textContent = `共 ${roles.length} 位玩家`;

}

function werewolfNext() {
  const ww = STATE.ww;
  if (ww.done) {
    navigateTo('home');
    return;
  }
  if (!ww.started) {
    // First click: start dealing - show first role
    ww.started = true;
    ww.flipped = true;
    const role = ww.roles[ww.index];
    document.getElementById('werewolf-card').classList.add('flipped');
    showWerewolfRole(role);
    // After "开始", first button is "我记住了"
    document.getElementById('werewolf-skip-btn').textContent = '我记住了';

    updateWerewolfProgress();
    vibrate();
    return;
  }
  // Toggle between showing role and advancing
  if (ww.flipped) {
    // Card is showing role - advance to next (hide card)
    ww.flipped = false;
    ww.index++;
    document.getElementById('werewolf-card').classList.remove('flipped');
    if (ww.index >= ww.roles.length) {
      ww.done = true;
      document.getElementById('werewolf-front-text').textContent = '🎉 发牌结束，游戏开始 🎉';
      document.getElementById('werewolf-skip-btn').style.display = 'none';
      document.getElementById('werewolf-progress').textContent = '';
    } else {
      document.getElementById('werewolf-front-text').textContent = '传递给下一位玩家吧';
      // After "我记住了", next button is "翻牌"
      document.getElementById('werewolf-skip-btn').textContent = '翻牌';

      updateWerewolfProgress();
    }
    vibrate();
  } else {
    // Card is showing front - flip to reveal next role
    ww.flipped = true;
    const role = ww.roles[ww.index];
    document.getElementById('werewolf-card').classList.add('flipped');
    showWerewolfRole(role);
    // After "翻牌", next button is "我记住了"
    document.getElementById('werewolf-skip-btn').textContent = '我记住了';
    updateWerewolfProgress();
    vibrate();
  }

}

function showWerewolfRole(role) {
  const img = document.getElementById('werewolf-back-img');

  const text = document.getElementById('werewolf-back-text');

  text.style.display = '';
  text.textContent = role;
  
  // Try to load image from wolfcard/ folder
  const imgName = WEREWOLF_IMG_MAP[role] || role;
  img.src = `wolfcard/${imgName}.jpg`;
  img.style.display = '';
  img.onerror = function() {
    // Try .png as fallback
    this.src = `wolfcard/${imgName}.png`;

      this.style.display = 'none';

  };

  };
}




function updateWerewolfProgress() {
  const ww = STATE.ww;
  const remaining = ww.roles.length - ww.index;
  document.getElementById('werewolf-progress').textContent = `剩余 ${remaining} 位玩家`;
}

// ============================================================
//  SPY
// ============================================================
function spyPromptPlayers() {
  const input = prompt('请输入总人数（4~8人）：', '6');
  const num = parseInt(input);
  if (isNaN(num) || num < 4 || num > 8) {
    showModal('⚠️ 输入有误', '请输入 4~8 之间的整数');
    return;
  }
  startSpy(num);
}

function startSpy(num) {
  // Pick random word pair
  const pair = SPY_WORDS[Math.floor(Math.random() * SPY_WORDS.length)];
  const spyIndex = Math.floor(Math.random() * num);
  const words = [];
  for (let i = 0; i < num; i++) {
    words.push(i === spyIndex ? pair[1] : pair[0]);
  }
  // Shuffle positions
  const indices = Array.from({length: num}, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const shuffledWords = indices.map(i => words[i]);
  const newSpyIndex = shuffledWords.indexOf(pair[1]);

  STATE.spy = { players: num, words: shuffledWords, spyIndex: newSpyIndex, index: 0, flipped: false, done: false, started: false };
  document.getElementById('spy-select').style.display = 'none';
  document.getElementById('spy-deal').style.display = 'block';
  document.getElementById('spy-card').classList.remove('flipped');
  document.getElementById('spy-front-text').textContent = '发牌开始';
  document.getElementById('spy-skip-btn').textContent = '开始';
  document.getElementById('spy-progress').textContent = `共 ${num} 位玩家`;

}

function spyNext() {
  const spy = STATE.spy;
  if (spy.done) {
    navigateTo('home');
    return;
  }
  if (!spy.started) {
    // First click: start dealing - show first word
    spy.started = true;
    spy.flipped = true;
    const word = spy.words[spy.index];
    document.getElementById('spy-card').classList.add('flipped');
    document.getElementById('spy-back-text').textContent = word;
    // After "开始", first button is "我记住了"
    document.getElementById('spy-skip-btn').textContent = '我记住了';

    updateSpyProgress();
    vibrate();
    return;
  }
  // Toggle between showing word and advancing
  if (spy.flipped) {
    // Card is showing word - advance to next (hide card)
    spy.flipped = false;
    spy.index++;
    document.getElementById('spy-card').classList.remove('flipped');
    if (spy.index >= spy.players) {
      spy.done = true;
      document.getElementById('spy-front-text').textContent = '🎉 发牌结束，游戏开始 🎉';
      document.getElementById('spy-skip-btn').style.display = 'none';
      document.getElementById('spy-progress').textContent = '';
    } else {
      document.getElementById('spy-front-text').textContent = '传递给下一位玩家吧';
      // After "我记住了", next button is "翻牌"
      document.getElementById('spy-skip-btn').textContent = '翻牌';

      updateSpyProgress();
    }
    vibrate();
  } else {
    // Card is showing front - flip to reveal next word
    spy.flipped = true;
    const word = spy.words[spy.index];
    document.getElementById('spy-card').classList.add('flipped');
    document.getElementById('spy-back-text').textContent = word;
    // After "翻牌", next button is "我记住了"
    document.getElementById('spy-skip-btn').textContent = '我记住了';
    updateSpyProgress();
    vibrate();
  }

}



function updateSpyProgress() {
  const spy = STATE.spy;
  document.getElementById('spy-progress').textContent = `剩余 ${spy.players - spy.index} 位玩家`;
}

// ============================================================
//  CHARADES
// ============================================================
function startCharades(minutes) {
  if (STATE.ch.running) stopCharadesTimer();
  const time = minutes * 60;
  const words = [...CHARADES_WORDS];
  for (let i = words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [words[i], words[j]] = [words[j], words[i]];
  }
  STATE.ch = { time, words, index: 0, correct: 0, timer: null, running: false, correctWords: [] };
  document.getElementById('charades-select').style.display = 'none';
  document.getElementById('charades-game').style.display = 'block';
  document.getElementById('charades-word-tags').style.display = 'none';
  document.getElementById('charades-word-tags').innerHTML = '';
  document.getElementById('charades-score').textContent = '猜对数量：0';
  showCharadesCountdown();
}

function charadesCustom() {
  const input = prompt('请输入分钟数（整数）：', '2');
  const num = parseInt(input);
  if (isNaN(num) || num < 1) {
    showModal('⚠️ 输入有误', '请输入正整数');
    return;
  }
  startCharades(num);
}

function showCharadesCountdown() {
  const overlay = document.getElementById('countdown-overlay');
  const numEl = document.getElementById('countdown-number');
  let count = 3;
  overlay.classList.add('show');
  numEl.textContent = count;
  numEl.style.animation = 'none';
  setTimeout(() => numEl.style.animation = 'countPop 0.8s ease-out', 10);

  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.textContent = count;
      numEl.style.animation = 'none';
      setTimeout(() => numEl.style.animation = 'countPop 0.8s ease-out', 10);
    } else {
      clearInterval(interval);
      overlay.classList.remove('show');
      beginCharadesGame();
    }
  }, 1000);
}

function beginCharadesGame() {
  STATE.ch.running = true;
  showCharadesWord();
  startCharadesTimer();
}

function showCharadesWord() {
  const ch = STATE.ch;
  if (ch.index >= ch.words.length) {
    // Refill words
    const words = [...CHARADES_WORDS];
    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [words[i], words[j]] = [words[j], words[i]];
    }
    ch.words = words;
    ch.index = 0;
  }
  const word = ch.words[ch.index];
  const display = document.getElementById('charades-word-display');
  display.textContent = word;
  display.style.animation = 'none';
  setTimeout(() => display.style.animation = 'wordPop 0.3s ease-out', 10);
}

// Add word pop animation
const styleSheet = document.createElement('style');
styleSheet.textContent = `
@keyframes wordPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
`;
document.head.appendChild(styleSheet);

function charadesCorrect() {
  if (!STATE.ch.running) return;
  vibrate();
  const ch = STATE.ch;
  const word = ch.words[ch.index];
  ch.correctWords.push(word);
  ch.correct++;
  ch.index++;
  document.getElementById('charades-score').textContent = `猜对数量：${ch.correct}`;
  // Add word tag
  addCharadesWordTag(word);
  showCharadesWord();
}

function charadesSkip() {
  if (!STATE.ch.running) return;
  vibrate();
  const ch = STATE.ch;
  ch.index++;
  showCharadesWord();
}

function addCharadesWordTag(word) {
  const container = document.getElementById('charades-word-tags');
  container.style.display = 'block';
  const tag = document.createElement('span');
  tag.className = 'word-tag';
  tag.textContent = `✅ ${word}`;
  // Position it
  const tags = container.querySelectorAll('.word-tag');
  const top = 60 + tags.length * 36;
  tag.style.top = top + 'px';
  tag.style.left = (12 + Math.floor(tags.length / 6) * 150) + 'px';
  container.appendChild(tag);
}

function startCharadesTimer() {
  const ch = STATE.ch;
  if (ch.timer) clearInterval(ch.timer);
  ch.timer = setInterval(() => {
    ch.time--;
    updateCharadesTimerDisplay();
    if (ch.time <= 0) {
      stopCharadesTimer();
      showModal('🎉 游戏结束！', `猜对 ${ch.correct} 个！`);
      document.getElementById('modal-overlay').onclick = function() {
        closeModal();
        document.getElementById('modal-overlay').onclick = null;
        resetCharades();
      };
    }
  }, 1000);
}

function stopCharadesTimer() {
  if (STATE.ch.timer) {
    clearInterval(STATE.ch.timer);
    STATE.ch.timer = null;
  }
  STATE.ch.running = false;
}

function updateCharadesTimerDisplay() {
  const ch = STATE.ch;
  const mins = Math.floor(ch.time / 60);
  const secs = ch.time % 60;
  document.getElementById('charades-timer').textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
}

function resetCharades() {
  stopCharadesTimer();
  document.getElementById('charades-select').style.display = 'block';
  document.getElementById('charades-game').style.display = 'none';
  document.getElementById('charades-word-tags').innerHTML = '';
  document.getElementById('charades-word-tags').style.display = 'none';
}
